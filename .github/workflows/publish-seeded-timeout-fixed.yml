name: Publish Timeout-Fixed Seeded Seerr

on:
  push:
    branches:
      - v3.4.1-custom
    paths:
      - '.github/workflows/publish-seeded-timeout-fixed.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit timestamp
        id: ts
        shell: bash
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build and push custom Seerr image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=0f2814608e421bab340d68fd85edcef2ec03a7f4
            BUILD_VERSION=3.4.1-episode-requests-seeded-timeoutfix
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}
          tags: |
            ghcr.io/gjb1088/seerr:3.4.1-episode-requests-seeded-timeoutfix
            ghcr.io/gjb1088/seerr:0f2814608e421bab340d68fd85edcef2ec03a7f4
          labels: |
            org.opencontainers.image.title=Seerr
            org.opencontainers.image.description=Seerr v3.4.1 with individual episode requests, seed-aware torrent selection, and extended Sonarr search timeout
            org.opencontainers.image.source=https://github.com/gjb1088/seerr
            org.opencontainers.image.revision=0f2814608e421bab340d68fd85edcef2ec03a7f4
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
