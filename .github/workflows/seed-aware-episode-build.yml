name: Seed-aware Episode Build

on:
  push:
    branches:
      - feature/seed-aware-episode-grabs

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply integration codemod
        run: node scripts/seeded-episode-search-codemod.mjs

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          server/api/servarr/sonarr.ts
          server/api/servarr/sonarrReleaseSelector.ts
          server/api/servarr/sonarrReleaseSelector.test.ts
          scripts/seeded-episode-search-codemod.mjs
          .github/workflows/seed-aware-episode-build.yml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check i18n
        run: node bin/check-i18n.js

      - name: Commit generated integration change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/api/servarr/sonarr.ts \
            server/api/servarr/sonarrReleaseSelector.ts \
            server/api/servarr/sonarrReleaseSelector.test.ts \
            scripts/seeded-episode-search-codemod.mjs \
            .github/workflows/seed-aware-episode-build.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat: prefer seeded releases for episode requests"
            git push origin HEAD:feature/seed-aware-episode-grabs
          fi
