name: Format Episode Availability Fix

on:
  push:
    branches:
      - fix/episode-picker-availability
    paths:
      - '.github/workflows/format-episode-availability.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/episode-picker-availability

      - name: Pnpm Setup
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install

      - name: Format changed files
        run: |
          pnpm prettier --write \
            server/lib/episodeAvailability.test.ts \
            server/lib/episodeAvailability.ts \
            server/routes/tv.ts \
            src/components/RequestModal/EpisodeRequestSelector.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/lib/episodeAvailability.test.ts \
            server/lib/episodeAvailability.ts \
            server/routes/tv.ts \
            src/components/RequestModal/EpisodeRequestSelector.tsx
          git commit -m "style: format episode availability fix"
          git push
